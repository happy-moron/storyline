<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Tiered selection menu -->
    <div class="tiered-menu" id="tieredMenu">
        <select id="authorSelect" disabled>
            <option value="">Select Author</option>
        </select>

        <select id="bookSelect" disabled>
            <option value="">Select Book</option>
        </select>
        
        <input type="number" id="chapterInput" placeholder="Enter Chapter Number" min="1" />
    </div>
    <button id="toggleMenuBtn" style="display: none;">☰</button>

    <div class="content" id="content"></div>
    <div class="audio-controls">
        <button id="prevChapterBtn">⏮️ Chapter</button>
        <button id="prevBtn">⏮️</button>
        <button id="playPauseBtn">▶️</button>
        <button id="stopBtn">⏹️</button>
        <button id="nextBtn">⏭️</button>
        <button id="nextChapterBtn">Chapter ⏭️</button>
        <button id="englishBtn">🇬🇧</button>
        <button id="speedBtn">1x</button>
        <button id="backchainModeBtn" title="Back-chain mode">🔁</button>
        <button id="breakdownBtn" title="Grammar breakdown">📖</button>
        <button id="flashcardBtn" style="display: none;" title="Flashcards" onclick="openFlashcards()">🎴</button>
    </div>

    <script>
        // ── Menu toggle ──────────────────────────────────────────────
        function toggleTieredMenu() {
            const tieredMenu = document.getElementById('tieredMenu');
            const toggleMenuBtn = document.getElementById('toggleMenuBtn');
            tieredMenu.classList.toggle('hidden');
            toggleMenuBtn.style.display = tieredMenu.classList.contains('hidden') ? 'block' : 'none';
        }

        document.getElementById('content').addEventListener('click', () => {
            const tieredMenu = document.getElementById('tieredMenu');
            const toggleMenuBtn = document.getElementById('toggleMenuBtn');
            if (!tieredMenu.classList.contains('hidden')) {
                tieredMenu.classList.add('hidden');
                toggleMenuBtn.style.display = 'block';
            }
        });

        document.getElementById('toggleMenuBtn').addEventListener('click', (event) => {
            toggleTieredMenu();
            event.stopPropagation();
        });

        // ── App state ────────────────────────────────────────────────
        let currentState = {
            authors: [],
            books: [],
            chapters: [],
            selectedAuthor: null,
            selectedBook: null,
            selectedChapter: null
        };

        let manifest = null;

        function findBookEntry(bookSlug) {
            if (!manifest) return null;
            for (const ae of manifest.books) {
                const be = ae.books.find(b => b.slug === bookSlug);
                if (be) return { author: ae.author, book: be };
            }
            return null;
        }

        async function loadManifest() {
            try {
                manifest = await fetch('books/manifest.json').then(r => r.json());
                currentState.authors = manifest.books.map(a => a.author);
                populateAuthors(currentState.authors);

                // If URL params specify author/book, auto-navigate
                const params = new URLSearchParams(window.location.search);
                const urlAuthor = params.get('author');
                const urlBook = params.get('book');
                if (urlAuthor && manifest.books.some(a => a.author === urlAuthor)) {
                    document.getElementById('authorSelect').value = urlAuthor;
                    const authorEntry = manifest.books.find(a => a.author === urlAuthor);
                    currentState.books = authorEntry ? authorEntry.books : [];
                    populateBooks(currentState.books, urlAuthor);
                    document.getElementById('bookSelect').disabled = false;
                    currentState.selectedAuthor = urlAuthor;
                    if (urlBook && currentState.books.some(b => b.slug === urlBook)) {
                        document.getElementById('bookSelect').value = urlBook;
                        currentState.selectedBook = urlBook;
                        document.getElementById('chapterInput').value = 1;
                        loadChapter(1);
                        checkFlashcards();
                    }
                }
            } catch (error) {
                console.error('Failed to load manifest:', error);
            }
        }

        // ── Init ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            loadDictionary();
            await loadManifest();
        });

        function populateAuthors(authors) {
            const select = document.getElementById('authorSelect');
            select.innerHTML = '<option value="">Select Author</option>';
            authors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                select.appendChild(option);
            });
            select.disabled = false;
        }

        // ── Selection handlers ───────────────────────────────────────
        document.getElementById('authorSelect').addEventListener('change', async (e) => {
            const author = e.target.value;
            if (!author) return;
            try {
                const authorEntry = manifest.books.find(a => a.author === author);
                const books = authorEntry ? authorEntry.books : [];
                currentState.books = books;
                populateBooks(books, author);
                document.getElementById('bookSelect').disabled = false;
                currentState.selectedAuthor = author;
            } catch (error) {
                console.error('Failed to load books:', error);
            }
        });

        function populateBooks(books, author) {
            const select = document.getElementById('bookSelect');
            select.innerHTML = '<option value="">Select Book</option>';
            books.forEach(book => {
                const option = document.createElement('option');
                option.value = book.slug;
                option.textContent = book.title;
                select.appendChild(option);
            });
            select.disabled = false;
        }

        document.getElementById('bookSelect').addEventListener('change', async (e) => {
            const book = e.target.value;
            if (!book) return;
            try {
                currentState.chapters = [];
                currentState.selectedBook = book;
                document.getElementById('chapterInput').value = 1;
                loadChapter(1);
                checkFlashcards();
            } catch (error) {
                console.error('Failed to load chapters:', error);
            }
        });

        document.getElementById('chapterInput').addEventListener('change', async (e) => {
            const chapterNumber = parseInt(e.target.value);
            if (!chapterNumber || chapterNumber < 1) return;
            loadChapter(chapterNumber);
        });

        // ── Chapter loading ──────────────────────────────────────────
        let loadingChapter = false;
        let flashcardAvailable = false;
        let flashcardManifest = null;

        async function checkFlashcards() {
            const book = currentState.selectedBook;
            if (!book) {
                document.getElementById('flashcardBtn').style.display = 'none';
                return;
            }
            try {
                if (!flashcardManifest) {
                    const resp = await fetch('books/flashcard-manifest.json');
                    if (resp.ok) {
                        flashcardManifest = await resp.json();
                    }
                }
                flashcardAvailable = !!(
                    flashcardManifest &&
                    flashcardManifest.books &&
                    flashcardManifest.books[book]
                );
                document.getElementById('flashcardBtn').style.display =
                    flashcardAvailable ? 'inline-block' : 'none';
            } catch {
                flashcardAvailable = false;
                document.getElementById('flashcardBtn').style.display = 'none';
            }
        }

        function openFlashcards() {
            const author = currentState.selectedAuthor;
            const book = currentState.selectedBook;
            window.open(
                `flashcards.html?author=${encodeURIComponent(author)}&book=${encodeURIComponent(book)}`,
                '_blank'
            );
        }

        async function loadChapter(chapterNumber) {
            if (loadingChapter) return;
            loadingChapter = true;
            const entry = findBookEntry(currentState.selectedBook);
            const prefix = entry ? entry.book.prefix : currentState.selectedBook;
            const author = currentState.selectedAuthor;
            const book = currentState.selectedBook;

            try {
                const tokenizedFilePath = `books/${author}/${book}/pipe/tokenized/${prefix}_${chapterNumber}.txt`;
                const sourceFilePath = `books/${author}/${book}/pipe/source/${prefix}_${chapterNumber}.txt`;
                const chunkJsonPath = `books/${author}/${book}/chunks/${prefix}_${chapterNumber}.json`;

                const tokenizedText = await fetch(`${tokenizedFilePath}`).then(r => r.text());
                const sourceText = await fetch(`${sourceFilePath}`).then(r => r.text());

                const tokenizedContent = parseTokenizedPipe(tokenizedText);
                const sourceContent = parseSourcePipe(sourceText);

                // Try to load chunk metadata; null if unavailable (fallback to per-sentence audio)
                let chunkMeta = null;
                try {
                    const resp = await fetch(`${chunkJsonPath}`);
                    if (resp.ok) {
                        chunkMeta = await resp.json();
                    }
                } catch (e) {
                    console.log('No chunk metadata found for this chapter');
                }

                currentState.selectedChapter = chapterNumber;
                loadContent(tokenizedContent, sourceContent, chunkMeta);
                applyInitialEnglishVisibility();
            } catch (error) {
                console.error('Failed to load chapter:', error);
            } finally {
                loadingChapter = false;
            }
        }

        // ── Pipe format parsers ─────────────────────────────────────
        function parseSourcePipe(text) {
            return text.trim().split('\n')
                .filter(line => line.includes('|||'))
                .map(line => {
                    const parts = line.split('|||', 2);
                    return {chinese: parts[0].trim(), english: parts[1].trim()};
                });
        }

        function parseTokenizedPipe(text) {
            if (text.includes('||')) return parseTokenizedCompact(text);
            return parseTokenizedLegacy(text);
        }

        function parseTokenizedCompact(text) {
            return text.trim().split('\n')
                .filter(line => line.trim())
                .map(line => {
                    const tokens = line.split('||').map(tokenStr => {
                        const parts = tokenStr.split('|');
                        if (parts.length === 2) {
                            return [parts[0], parts[0], parts[1]];
                        }
                        const token = [parts[0], parts[1], parts[2]];
                        if (parts.length > 3) {
                            const comps = parts.slice(3)
                                .filter(c => c.includes('~'))
                                .map(c => {
                                    const [ct, cp] = c.split('~', 2);
                                    return [ct, cp];
                                });
                            if (comps.length) token.push(comps);
                        }
                        return token;
                    });
                    return {t: tokens};
                });
        }

        function parseTokenizedLegacy(text) {
            const sentences = [];
            let current = [];
            for (const line of text.trim().split('\n')) {
                if (!line.trim()) {
                    if (current.length) { sentences.push({t: current}); current = []; }
                    continue;
                }
                if (!line.includes('|')) continue;
                const parts = line.split('|');
                if (parts.length === 2) {
                    current.push([parts[0], parts[0], parts[1]]);
                } else if (parts.length >= 3) {
                    const token = [parts[0], parts[1], parts[2]];
                    if (parts.length > 3) {
                        const comps = parts.slice(3)
                            .filter(c => c.includes('~'))
                            .map(c => {
                                const [ct, cp] = c.split('~', 2);
                                return [ct, cp];
                            });
                        if (comps.length) token.push(comps);
                    }
                    current.push(token);
                }
            }
            if (current.length) sentences.push({t: current});
            return sentences;
        }

        // ── Dictionary ───────────────────────────────────────────────
        let dictionary = {};
        async function loadDictionary() {
            try {
                const response = await fetch('dict/custom_dict.json');
                dictionary = await response.json();
            } catch (error) {
                console.error('Failed to load dictionary:', error);
            }
        }

        const dictionaryPane = document.createElement('div');
        dictionaryPane.id = 'dictionary-pane';
        document.body.appendChild(dictionaryPane);

        // Saved vocabulary panel
        const savedVocabPanel = document.createElement('div');
        savedVocabPanel.id = 'saved-vocab-panel';
        savedVocabPanel.style.display = 'none';
        savedVocabPanel.innerHTML = `
            <div class="saved-vocab-header">
                <span class="saved-vocab-title">Saved Vocabulary</span>
                <span class="saved-vocab-actions">
                    <button class="saved-vocab-copy-btn" onclick="copySavedVocab()" title="Copy all">📋 Copy All</button>
                    <button class="saved-vocab-close-btn" onclick="closeSavedVocabPanel()" title="Close">✕</button>
                </span>
            </div>
            <div class="saved-vocab-body">
                <table class="saved-vocab-table"><tbody id="savedVocabList"></tbody></table>
            </div>
        `;
        document.body.appendChild(savedVocabPanel);

        function handleTokenDoubleClick(event) {
            const sentenceDiv = event.target.closest('.sentence');
            if (sentenceDiv) {
                const lineIdx = parseInt(sentenceDiv.dataset.lineIndex);
                if (!isNaN(lineIdx)) {
                    stopPlayback();
                    playLine(lineIdx);
                }
            }
        }

        function handleTokenClickWithDictionary(event) {
            let token = event.target.textContent.trim();
            let chineseToken = token;

            if (event.target.className === 'token pinyin') {
                const pinyinDiv = event.target.closest('.pinyin');
                const chineseDiv = pinyinDiv.nextElementSibling;
                chineseToken = chineseDiv.querySelector('.token').textContent.trim();
            }

            const entry = dictionary[chineseToken];
            
            if (dictionaryPane.style.display === 'block' && dictionaryPane.dataset.currentToken === chineseToken) {
                clearDictionaryEntry();
                event.stopPropagation();
            } else {
                if (entry) {
                    displayDictionaryEntry(chineseToken, entry);
                } else {
                    clearDictionaryEntry();
                }
            }
        }

        document.addEventListener('click', (event) => {
            if (!event.target.classList.contains('token') && 
                !event.target.closest('#dictionary-pane') &&
                dictionaryPane.style.display === 'block') {
                clearDictionaryEntry();
            }
        });

        function hasFlashcard(word) {
            return !!(
                flashcardManifest &&
                flashcardManifest.words &&
                flashcardManifest.words[word]
            );
        }

        function findAuthorForBook(bookSlug) {
            if (!manifest) return '';
            for (const ae of manifest.books) {
                if (ae.books.some(b => b.slug === bookSlug)) {
                    return ae.author;
                }
            }
            return '';
        }

        function playFlashcardAudio(word) {
            const src = `books/vocab/audio/${encodeURIComponent(word)}_word.mp3`;
            const audio = new Audio(src);
            audio.play().catch(e => console.error('Flashcard audio play failed:', e));
        }

        function displayDictionaryEntry(chineseToken, entry) {
            dictionaryPane.dataset.currentToken = chineseToken;
            const isSaved = isWordSaved(chineseToken);

            let html = `<div class="dict-header">
                <span class="dict-header-title">Dictionary</span>
                <span class="dict-header-actions">
                    <button class="saved-vocab-btn" onclick="event.stopPropagation(); viewSavedVocab()" title="View saved vocabulary">📋 <span id="savedCountBadge">${getSavedVocab().length}</span></button>
                </span>
            </div>`;

            html += '<table class="dictionary-table">';

            // First row: token with audio button, flashcard link, and save button inline
            let headerHtml = `<span class="dict-token">${chineseToken}</span>`;
            if (hasFlashcard(chineseToken)) {
                headerHtml += ` <button class="dict-audio-btn" onclick="event.stopPropagation(); playFlashcardAudio('${chineseToken.replace(/'/g, "\\'")}')" title="Play word audio">🔊</button>`;

                // Link to the correct book for this word
                let book = currentState.selectedBook;
                let author = currentState.selectedAuthor || '';
                if (!book || !(flashcardManifest.books[book] || []).includes(chineseToken)) {
                    // Word not in current book — find any book that has it
                    for (const [slug, words] of Object.entries(flashcardManifest.books)) {
                        if (words.includes(chineseToken)) {
                            book = slug;
                            author = findAuthorForBook(slug);
                            break;
                        }
                    }
                }
                const flashcardUrl = `flashcards.html?author=${encodeURIComponent(author)}&book=${encodeURIComponent(book)}&word=${encodeURIComponent(chineseToken)}`;
                headerHtml += ` <a href="${flashcardUrl}" target="_blank" class="flashcard-link" title="View Flashcard">🎴</a>`;
            }
            headerHtml += ` <button class="dict-save-btn ${isSaved ? 'saved' : ''}" onclick="event.stopPropagation(); toggleSavedVocab('${chineseToken.replace(/'/g, "\\'")}')" title="${isSaved ? 'Remove from saved' : 'Save word'}">${isSaved ? '★' : '☆'}</button>`;
            html += `<tr><td>${headerHtml}</td></tr>`;

            if (entry.pinyin) {
                html += `<tr><td>${entry.pinyin}</td></tr>`;
            }

            if (entry.definition && Array.isArray(entry.definition)) {
                entry.definition.forEach(def => {
                    html += `<tr><td>${def.meaning}</td></tr>`;
                    if (def.example) {
                        html += `<tr><td>Chinese: ${def.example.chinese}<br>Pinyin: ${def.example.pinyin}<br>English: ${def.example.english}</td></tr>`;
                    }
                });
            }

            html += '</table>';
            dictionaryPane.innerHTML = html;
            dictionaryPane.style.display = 'block';
        }

        function clearDictionaryEntry() {
            dictionaryPane.innerHTML = '';
            dictionaryPane.style.display = 'none';
            delete dictionaryPane.dataset.currentToken;
        }

        // ── Saved Vocabulary ──────────────────────────────────────────
        function getSavedVocab() {
            try {
                return JSON.parse(localStorage.getItem('savedVocab') || '[]');
            } catch {
                return [];
            }
        }

        function isWordSaved(chineseToken) {
            return getSavedVocab().some(item => item.chinese === chineseToken);
        }

        function saveVocabWord(chineseToken, pinyin) {
            const vocab = getSavedVocab();
            if (!vocab.some(item => item.chinese === chineseToken)) {
                vocab.push({ chinese: chineseToken, pinyin: pinyin || '' });
                localStorage.setItem('savedVocab', JSON.stringify(vocab));
            }
            updateSavedCountBadge();
        }

        function removeVocabWord(chineseToken) {
            const vocab = getSavedVocab().filter(item => item.chinese !== chineseToken);
            localStorage.setItem('savedVocab', JSON.stringify(vocab));
            updateSavedCountBadge();
        }

        function toggleSavedVocab(chineseToken) {
            const entry = dictionary[chineseToken];
            const pinyin = entry ? entry.pinyin || '' : '';
            if (isWordSaved(chineseToken)) {
                removeVocabWord(chineseToken);
            } else {
                saveVocabWord(chineseToken, pinyin);
            }
            // Refresh the dictionary entry display to update save button
            if (dictionaryPane.dataset.currentToken === chineseToken) {
                displayDictionaryEntry(chineseToken, dictionary[chineseToken]);
            }
        }

        function updateSavedCountBadge() {
            const badge = document.getElementById('savedCountBadge');
            if (badge) {
                badge.textContent = getSavedVocab().length;
            }
        }

        function viewSavedVocab() {
            const vocab = getSavedVocab();
            const panel = document.getElementById('saved-vocab-panel');
            const list = document.getElementById('savedVocabList');

            if (vocab.length === 0) {
                list.innerHTML = '<tr><td class="saved-vocab-empty">No saved words yet.</td></tr>';
            } else {
                list.innerHTML = vocab.map(item =>
                    `<tr><td class="saved-vocab-entry"><span class="saved-vocab-chinese">${item.chinese}</span>, ${item.pinyin}</td></tr>`
                ).join('');
            }

            panel.style.display = 'block';
            dictionaryPane.style.display = 'none';
        }

        function closeSavedVocabPanel() {
            document.getElementById('saved-vocab-panel').style.display = 'none';
        }

        function copySavedVocab() {
            const vocab = getSavedVocab();
            const text = vocab.map(item => `${item.chinese}, ${item.pinyin}`).join('\n');
            navigator.clipboard.writeText(text).catch(() => {
                // Fallback for older browsers
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            });
        }

        function addTokenClickHandlers() {
            const tokens = document.querySelectorAll('.token');
            tokens.forEach(token => {
                token.addEventListener('click', handleTokenClickWithDictionary);
                token.addEventListener('dblclick', handleTokenDoubleClick);
            });

        }

        // ── Chunk-based audio playback ───────────────────────────────
        // lineMap[globalLineIndex] = { chunkIdx, localIdx, start_zh, end_zh }
        let lineMap = [];
        let backchainMap = [];  // backchainMap[lineIndex] = { steps: [...], words: [...] }
        let chunkAudioElements = [];  // <audio> elements, one per chunk (zh)
        let currentLineIndex = -1;
        let currentAudio = null;
        let lineEndTimer = null;
        let isPlaying = false;
        let backchainTimer = null;
        let backchainStepIndex = -1;
        let backchainLineIndex = -1;
        let backchainMode = false;
        let breakdownMode = false;
        let breakdownMap = [];  // breakdownMap[lineIndex] = ["point1", "point2", ...]

        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const speedBtn = document.getElementById('speedBtn');
        const backchainModeBtn = document.getElementById('backchainModeBtn');
        const breakdownBtn = document.getElementById('breakdownBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevChapterBtn = document.getElementById('prevChapterBtn');
        const nextChapterBtn = document.getElementById('nextChapterBtn');
        const englishBtn = document.getElementById('englishBtn');

        let playbackSpeeds = [0.5, 0.7, 0.85, 1.0];
        let currentSpeedIndex = 3;

        function buildLineMap(chunkMeta) {
            lineMap = [];
            backchainMap = [];
            breakdownMap = [];
            if (!chunkMeta || !chunkMeta.chunks) return;

            for (let ci = 0; ci < chunkMeta.chunks.length; ci++) {
                const chunk = chunkMeta.chunks[ci];
                if (!chunk.lines) continue;
                const range = chunk.line_range;
                if (!range) continue;

                for (let li = 0; li < chunk.lines.length; li++) {
                    const globalIdx = range[0] + li;
                    if (globalIdx > range[1]) break;
                    const line = chunk.lines[li];
                    lineMap[globalIdx] = {
                        chunkIdx: ci,
                        localIdx: li,
                        start_zh: line.start_zh,
                        end_zh: line.end_zh,
                    };
                    if (line.backchain && line.backchain.length > 0) {
                        backchainMap[globalIdx] = {
                            steps: line.backchain,
                            words: line.words || null,
                        };
                    }
                    if (line.breakdown && line.breakdown.length > 0) {
                        breakdownMap[globalIdx] = line.breakdown;
                    }
                }
            }
        }

        function createChunkAudioElements(chunkMeta) {
            chunkAudioElements.forEach(el => {
                el.pause();
                el.removeAttribute('src');
                el.remove();
            });
            chunkAudioElements = [];

            if (!chunkMeta || !chunkMeta.chunks || chunkMeta.chunks.length === 0) {
                return;
            }

            const author = currentState.selectedAuthor;
            const book = currentState.selectedBook;

            for (let ci = 0; ci < chunkMeta.chunks.length; ci++) {
                const chunk = chunkMeta.chunks[ci];
                const audioFile = chunk.audio_zh;
                if (!audioFile) {
                    return;
                }

                const audio = document.createElement('audio');
                audio.id = `chunk-audio-${ci}`;
                audio.src = `books/${author}/${book}/audio/${audioFile}`;
                audio.loop = false;
                audio.playbackRate = playbackSpeeds[currentSpeedIndex];
                audio.preload = 'auto';

                audio.addEventListener('play', () => {
                    currentAudio = audio;
                    playPauseBtn.textContent = '⏸️';
                    isPlaying = true;
                });

                audio.addEventListener('pause', () => {
                    if (currentAudio === audio) {
                        playPauseBtn.textContent = '▶️';
                        isPlaying = false;
                    }
                });

                audio.addEventListener('ended', () => {
                    if (currentAudio === audio) {
                        isPlaying = false;
                        playPauseBtn.textContent = '▶️';
                        clearLineHighlight();
                        resetBackchainButtons();
                    }
                });

                // Hidden — appended to body so it loads
                audio.style.display = 'none';
                document.body.appendChild(audio);
                chunkAudioElements.push(audio);
            }
        }

        function stopPlayback() {
            clearLineEndTimer();
            clearBackchainTimer();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
            clearLineHighlight();
            resetBackchainButtons();
            backchainStepIndex = -1;
            backchainLineIndex = -1;
        }

        function clearLineEndTimer() {
            if (lineEndTimer) {
                clearInterval(lineEndTimer);
                lineEndTimer = null;
            }
        }

        function clearLineHighlight() {
            document.querySelectorAll('.sentence.active-line').forEach(el => {
                el.classList.remove('active-line');
            });
        }

        function highlightLine(lineIndex) {
            clearLineHighlight();
            const sentenceDiv = document.querySelector(`.sentence[data-line-index="${lineIndex}"]`);
            if (sentenceDiv) {
                sentenceDiv.classList.add('active-line');
                sentenceDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            if (breakdownMode) {
                showBreakdownForLine(lineIndex);
            }
        }

        function playLine(lineIndex) {
            if (backchainMode && backchainMap[lineIndex]) {
                playBackchain(lineIndex);
                return;
            }

            const mapping = lineMap[lineIndex];
            if (!mapping) return;

            const audio = chunkAudioElements[mapping.chunkIdx];
            if (!audio) return;

            clearLineEndTimer();
            highlightLine(lineIndex);
            currentLineIndex = lineIndex;

            const startTime = mapping.start_zh;
            const endTime = mapping.end_zh;

            if (currentAudio !== audio) {
                if (currentAudio) {
                    currentAudio.pause();
                }
                currentAudio = audio;
            }

            audio.currentTime = startTime;
            audio.play().catch(e => console.error('Audio play failed:', e));
            isPlaying = true;
            playPauseBtn.textContent = '⏸️';

            // Poll for end of line (only auto-advance when backchain mode is off)
            if (!backchainMode) {
                lineEndTimer = setInterval(() => {
                    if (audio.currentTime >= endTime) {
                        clearLineEndTimer();
                        advanceToNextLine();
                    }
                }, 50);
            } else {
                // Stop at end of line when backchain mode is on (no backchain data case)
                lineEndTimer = setInterval(() => {
                    if (audio.currentTime >= endTime) {
                        clearLineEndTimer();
                        stopPlayback();
                        clearLineHighlight();
                    }
                }, 50);
            }
        }

        function advanceToNextLine() {
            const nextIdx = currentLineIndex + 1;
            if (nextIdx < lineMap.length && lineMap[nextIdx]) {
                playLine(nextIdx);
            } else {
                stopPlayback();
                clearLineHighlight();
            }
        }

        function playPrevLine() {
            if (currentLineIndex > 0) {
                playLine(currentLineIndex - 1);
            }
        }

        // ── Back-chain playback ──────────────────────────────────────

        function clearBackchainTimer() {
            if (backchainTimer) {
                clearInterval(backchainTimer);
                backchainTimer = null;
            }
        }

        function resetBackchainButtons() {
            backchainStepIndex = -1;
            backchainLineIndex = -1;
        }

        function playBackchain(lineIndex) {
            const mapping = lineMap[lineIndex];
            const bcData = backchainMap[lineIndex];
            if (!mapping || !bcData) return;

            const audio = chunkAudioElements[mapping.chunkIdx];
            if (!audio) return;

            // If already playing a backchain for this line, cancel it
            if (backchainLineIndex === lineIndex && backchainStepIndex >= 0) {
                stopPlayback();
                return;
            }

            stopPlayback();
            clearLineHighlight();
            highlightLine(lineIndex);

            backchainLineIndex = lineIndex;
            backchainStepIndex = 0;

            // Steps: backchain fragments + the full sentence as final step
            const fullText = bcData.fullText || '';
            const steps = [...bcData.steps, fullText];

            if (currentAudio !== audio) {
                currentAudio = audio;
            }

            _playBackchainStep(audio, steps, lineIndex, 0);
        }

        function _playBackchainStep(audio, steps, lineIndex, stepIdx) {
            if (stepIdx >= steps.length) {
                resetBackchainButtons();
                return;
            }

            backchainStepIndex = stepIdx;
            const bcData = backchainMap[lineIndex];
            const words = bcData ? bcData.words : null;
            const mapping = lineMap[lineIndex];

            let startTime, endTime;

            if (stepIdx === steps.length - 1) {
                // Final step: play the full sentence from beginning to end
                startTime = mapping.start_zh;
                endTime = mapping.end_zh;
            } else {
                const stepText = steps[stepIdx];
                if (words && words.length > 0) {
                    const suffixStart = _findSuffixStartTime(words, stepText);
                    startTime = suffixStart;
                } else {
                    // Fallback: proportional estimation based on character count
                    const fullLen = steps[steps.length - 1].length;
                    const ratio = (fullLen - stepText.length) / fullLen;
                    const dur = mapping.end_zh - mapping.start_zh;
                    startTime = mapping.start_zh + ratio * dur;
                }
                endTime = mapping.end_zh;
            }

            audio.currentTime = startTime;
            audio.play().catch(e => console.error('Backchain audio play failed:', e));
            isPlaying = true;
            playPauseBtn.textContent = '⏸️';

            // Allow seek to settle before polling currentTime
            clearBackchainTimer();
            setTimeout(() => {
                backchainTimer = setInterval(() => {
                    if (audio.currentTime >= endTime || audio.ended) {
                        clearBackchainTimer();
                        _playBackchainStep(audio, steps, lineIndex, stepIdx + 1);
                    }
                }, 50);
            }, 80);
        }

        const CJK_PUNCT_RE = /[\u2000-\u206F\u3000-\u303F\uFF00-\uFFEF！＂＃＄％＆＇（）＊＋，－．／：；＜＝＞？＠［＼］＾＿｀｛｜｝～、。“”‘’《》【】。，、！？：；（）「」『』]/g;

        function _normalizeSuffix(text) {
            // Strip CJK punctuation so backchain steps (which include "？", "！", etc.)
            // can be matched against the words array (which has no punctuation tokens).
            return text.replace(CJK_PUNCT_RE, '');
        }

        function _findSuffixStartTime(words, suffixText) {
            // Match suffix text against words from the end backwards
            // Returns the start_time of the first word in the matched suffix
            if (!words || words.length === 0) return 0;

            // Strip punctuation from suffix: words array does not include punctuation tokens
            // from forced alignment, but backchain steps may include "？", "！", "。", "，" etc.
            const cleanSuffix = _normalizeSuffix(suffixText);
            if (cleanSuffix.length === 0) {
                return words[0].start_time;
            }

            let accumulated = '';
            for (let i = words.length - 1; i >= 0; i--) {
                accumulated = words[i].text + accumulated;
                if (accumulated === cleanSuffix) {
                    return words[i].start_time;
                }
                if (accumulated.length > cleanSuffix.length) break;
            }

            // Fallback: find first word whose accumulated suffix contains the target
            for (let start = words.length - 1; start >= 0; start--) {
                let seg = '';
                for (let j = start; j < words.length; j++) {
                    seg += words[j].text;
                }
                if (seg === cleanSuffix) {
                    return words[start].start_time;
                }
            }

            // Final fallback: proportional estimation using clean suffix text
            const fullText = words.map(w => w.text).join('');
            const chFullLen = fullText.length;
            const chSuffixLen = cleanSuffix.length;
            const ratio = (chFullLen - chSuffixLen) / Math.max(chFullLen, 1);
            const dur = words[words.length - 1].end_time - words[0].start_time;
            return words[0].start_time + ratio * dur;
        }

        // ── Control button handlers ──────────────────────────────────
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                clearLineEndTimer();
                if (backchainStepIndex >= 0) {
                    stopPlayback();
                    return;
                }
                if (currentAudio) {
                    currentAudio.pause();
                }
                isPlaying = false;
                playPauseBtn.textContent = '▶️';
            } else {
                if (currentAudio) {
                    const mapping = lineMap[currentLineIndex >= 0 ? currentLineIndex : 0];
                    if (mapping && currentAudio.currentTime < mapping.end_zh && currentAudio.currentTime >= mapping.start_zh) {
                        currentAudio.play().catch(e => console.error('Audio play failed:', e));
                        isPlaying = true;
                        playPauseBtn.textContent = '⏸️';
                        clearLineEndTimer();
                        lineEndTimer = setInterval(() => {
                            if (currentAudio.currentTime >= mapping.end_zh) {
                                clearLineEndTimer();
                                advanceToNextLine();
                            }
                        }, 50);
                        return;
                    }
                }
                const startIdx = currentLineIndex >= 0 ? currentLineIndex : 0;
                playLine(startIdx);
            }
        });

        stopBtn.addEventListener('click', () => {
            stopPlayback();
            if (currentAudio) {
                currentAudio.currentTime = 0;
            }
            currentLineIndex = -1;
        });

        speedBtn.addEventListener('click', () => {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            let currentSpeed = playbackSpeeds[currentSpeedIndex];
            speedBtn.textContent = currentSpeed + 'x';

            chunkAudioElements.forEach(audio => {
                audio.playbackRate = currentSpeed;
            });
        });

        prevBtn.addEventListener('click', () => {
            if (currentLineIndex < 0) {
                currentLineIndex = 0;
            }
            playPrevLine();
        });

        nextBtn.addEventListener('click', () => {
            if (currentLineIndex < 0) {
                currentLineIndex = 0;
            }
            advanceToNextLine();
        });

        prevChapterBtn.addEventListener('click', () => {
            stopPlayback();
            const currentChapter = parseInt(document.getElementById('chapterInput').value);
            if (currentChapter > 1) {
                document.getElementById('chapterInput').value = currentChapter - 1;
                loadChapter(currentChapter - 1);
            }
        });

        nextChapterBtn.addEventListener('click', () => {
            stopPlayback();
            const currentChapter = parseInt(document.getElementById('chapterInput').value);
            document.getElementById('chapterInput').value = currentChapter + 1;
            loadChapter(currentChapter + 1);
        });

        // ── Content rendering ────────────────────────────────────────
        function loadContent(tokenizedSentences, sourceSentences, chunkMeta) {
            const contentDiv = document.getElementById('content');
            stopPlayback();
            currentLineIndex = -1;
            contentDiv.innerHTML = '';

            // Setup chunk-based or fallback audio
            createChunkAudioElements(chunkMeta);
            buildLineMap(chunkMeta);

            for (let i = 0; i < tokenizedSentences.length; i++) {
                const sentenceData = tokenizedSentences[i];
                const sentence = sentenceData.t;
                const sentenceDiv = document.createElement('div');
                sentenceDiv.className = 'sentence';
                sentenceDiv.dataset.lineIndex = i;

                let chineseSentence = '';
                let pinyinSentence = '';

                sentence.forEach(token => {
                    chineseSentence += `<span class="token">${token[0]}</span>`;
                    pinyinSentence += `<span class="token">${token[1]}</span>`;
                });

                const englishTranslation = sourceSentences[i] ? sourceSentences[i].english : '';

                if (backchainMap[i]) {
                    backchainMap[i].fullText = chineseSentence.replace(/<[^>]+>/g, '');
                }

                let breakdownHtml = '';
                if (breakdownMap[i]) {
                    const points = breakdownMap[i].map(p => `<li>${p}</li>`).join('');
                    breakdownHtml = `<div class="breakdown hidden" data-line-index="${i}"><ul>${points}</ul></div>`;
                }

                sentenceDiv.innerHTML = `
                    <div class="pinyin">${pinyinSentence}</div>
                    <div class="chinese">${chineseSentence}</div>
                    <div class="translation">${englishTranslation}</div>
                    ${breakdownHtml}
                `;

                contentDiv.appendChild(sentenceDiv);
            }
            addTokenClickHandlers();
            applyInitialBreakdownVisibility();
        }

        // ── Breakdown toggle ────────────────────────────────────────────

        function toggleBreakdownMode() {
            breakdownMode = !breakdownMode;
            if (breakdownBtn) {
                breakdownBtn.classList.toggle('active', breakdownMode);
            }
            // Hide all breakdowns first
            document.querySelectorAll('.breakdown').forEach(el => {
                el.classList.add('hidden');
            });
            if (breakdownMode && currentLineIndex >= 0) {
                // Show only the active line's breakdown
                const breakdownDiv = document.querySelector(`.breakdown[data-line-index="${currentLineIndex}"]`);
                if (breakdownDiv) {
                    breakdownDiv.classList.remove('hidden');
                }
            }
        }

        function showBreakdownForLine(lineIndex) {
            // Hide all breakdowns first
            document.querySelectorAll('.breakdown').forEach(el => {
                el.classList.add('hidden');
            });
            // Show only the one for the active line
            const breakdownDiv = document.querySelector(`.breakdown[data-line-index="${lineIndex}"]`);
            if (breakdownDiv) {
                breakdownDiv.classList.remove('hidden');
            }
        }

        if (breakdownBtn) {
            breakdownBtn.addEventListener('click', toggleBreakdownMode);
        }

        function applyInitialBreakdownVisibility() {
            if (!breakdownMode) {
                document.querySelectorAll('.breakdown').forEach(el => {
                    el.classList.add('hidden');
                });
            }
        }

        // ── English translations toggle ──────────────────────────────
        const englishVisibilityKey = 'englishTranslationsVisible';
        let englishTranslationsVisible = localStorage.getItem(englishVisibilityKey) === 'true';

        function toggleEnglishTranslations() {
            const translations = document.querySelectorAll('.translation');
            translations.forEach(translation => {
                translation.classList.toggle('hidden');
            });
            englishTranslationsVisible = !englishTranslationsVisible;
            localStorage.setItem(englishVisibilityKey, englishTranslationsVisible);
        }

        function applyInitialEnglishVisibility() {
            const translations = document.querySelectorAll('.translation');
            translations.forEach(translation => {
                if (englishTranslationsVisible) {
                    translation.classList.remove('hidden');
                } else {
                    translation.classList.add('hidden');
                }
            });
        }

        englishBtn.addEventListener('click', toggleEnglishTranslations);

        backchainModeBtn.addEventListener('click', () => {
            backchainMode = !backchainMode;
            backchainModeBtn.classList.toggle('active', backchainMode);
            if (backchainMode) {
                stopPlayback();
            }
        });
    </script>
</body>
</html>

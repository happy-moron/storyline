[project]
name = "storyline"
version = "0.1.0"
description = "Language learning material generation toolkit"
requires-python = ">=3.9"
license = {text = "MIT"}

# Third‑party dependencies
dependencies = [
    "zsp-llm-client>=0.1.0",
    "pydub>=0.25.1",
]

[project.scripts]
storyline-prompt = "storyline.prompt_utils.prompt:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pytest configuration
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# =============================================================================
# Voice definitions
# =============================================================================
# Each voice specifies how to generate speech for a language.
#
# mode: "custom_voice" — use a Qwen3 pretrained speaker via /custom_voice
#       "voice_clone"  — clone a voice from reference audio via /voice_clone
#
# Fields by mode:
#   custom_voice: speaker, language, instruct (optional)
#   voice_clone:  ref_audio (path to .mp3/.wav), ref_text, language

# -- Pretrained speakers (custom_voice) --

[voices.serena]
mode = "custom_voice"
language = "chinese"
speaker = "Serena"
instruct = ""

[voices.ryan]
mode = "custom_voice"
language = "english"
speaker = "Ryan"
instruct = ""

# -- Cloned voices (voice_clone) --

[voices.ann]
mode = "voice_clone"
language = "chinese"
ref_audio = "tests/audio/samples/ann-c1.mp3"
ref_text = "你好！我叫齐磊，今年二十五岁。我住在苏州，但每天去上海工作。早上骑自行车到火车站，再坐高铁乘渡。下午帮主人解决计算机问题，晚上练习太极拳。周末我常去山上看日出，或者朋友一起吃火锅。生活很忙碌，但我觉得非常有意思！"

[voices.scott]
mode = "voice_clone"
language = "english"
ref_audio = "tests/audio/samples/scott-1.mp3"
ref_text = "That quick beige fox jumped in the air over each thin dog. Look out, I shout, for he's foiled you again, creating chaos. Are those shy Eurasian footwear, cowboy chaps, or jolly earthmoving headgear? The hungry purple dinosaur ate the kind, zingy fox, the jabbering crab, and the mad whale and started vending and quacking. With tenure, Suzie'd have all the more leisure for yachting, but her publications are no good. Shaw, those twelve beige hooks are joined if I patch a young, gooey mouth. The beige hue on the waters of the loch impressed all, including the French queen, before she heard that symphony again, just as young Arthur wanted."

[voices.male_1]
mode = "voice_clone"
language = "chinese"
ref_audio = "tests/audio/samples/zh-ref-magic-38_5735_20170914204637.mp3"
ref_text = "嗯听着倒是个不错的主意但南方的气候我实在不敢恭维尤其是受不了了冬季又潮又冷还没暖气"

# =============================================================================
# Profiles
# =============================================================================
# Each profile defines the sentence cadence: an ordered sequence of steps.
#
# sequence:  list of { lang, voice, speed } steps.
#            lang  — "zh" (Chinese) or "en" (English)
#            voice — voice name from the [voices] section above
#            speed — tempo multiplier (1.0 = normal, 0.8 = 80% speed, etc.)
# pause_ms:  silence (ms) between steps within a sentence.

[profiles.default]
use_instruct = false
pause_ms = 300
sequence = [
  { lang = "zh", voice = "serena", speed = 0.8 },
  { lang = "en", voice = "ryan", speed = 1.0 },
  { lang = "zh", voice = "serena", speed = 0.9 },
  { lang = "en", voice = "ryan", speed = 1.0 },
  { lang = "zh", voice = "serena", speed = 1.0 },
  { lang = "en", voice = "ryan", speed = 1.0 },
]

[profiles.voice-clone]
use_instruct = false
pause_ms = 300
sequence = [
  { lang = "zh", voice = "ann", speed = 0.8 },
  { lang = "en", voice = "scott", speed = 1.0 },
  { lang = "zh", voice = "ann", speed = 0.9 },
  { lang = "en", voice = "scott", speed = 1.0 },
  { lang = "zh", voice = "ann", speed = 1.0 },
  { lang = "en", voice = "scott", speed = 1.0 },
]
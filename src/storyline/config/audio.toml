# =============================================================================
# Voice definitions
# =============================================================================
# Each voice specifies how to generate speech for a language.
#
# mode: "custom_voice" — use a Qwen3 pretrained speaker via /custom_voice
#       "voice_clone"  — clone a voice from reference audio via /voice_clone
#
# Fields by mode:
#   custom_voice: speaker, language, instruct (optional)
#   voice_clone:  ref_audio (path to .mp3/.wav), ref_text, language
#
# Reference text for cloned voices is also stored as voices/<name>-ref.txt.

# -- Pretrained speakers (custom_voice) —

[voices.serena]
mode = "custom_voice"
language = "chinese"
speaker = "Serena"
instruct = ""

[voices.ryan]
mode = "custom_voice"
language = "english"
speaker = "Ryan"
instruct = ""

# -- Podcast host hosts —
# Builtin speakers used when --builtin-hosts is passed.
# Clone references are read from voices/{teacher,student}.wav and
# voices/{teacher,student}-ref.txt at runtime.

[podcast.hosts]
teacher_builtin_speaker = "Serena"
student_builtin_speaker = "Ryan"

# -- Cloned voices (voice_clone) — book pipeline defaults --

[voices.ann]
mode = "voice_clone"
language = "chinese"
ref_audio = "voices/ann-short.mp3"
ref_text = "你好！我叫齐磊，今年二十五岁。我住在苏州，但每天去上海工作。"

[voices.scott]
mode = "voice_clone"
language = "english"
ref_audio = "voices/scott-short.mp3"
ref_text = "That quick beige fox jumped in the air over each thin dog."

# =============================================================================
# Profiles
# =============================================================================
# Each profile defines the sentence cadence: an ordered sequence of steps.
#
# sequence:  list of { lang, voice, speed } steps.
#            lang  — "zh" (Chinese) or "en" (English)
#            voice — voice name from the [voices] section above
#            speed — tempo multiplier (1.0 = normal, 0.8 = 80% speed, etc.)
# pause_ms:  silence (ms) between steps within a sentence.

[profiles.default]
use_instruct = false
pause_ms = 300
sequence = [
  { lang = "zh", voice = "serena", speed = 0.6 },
  { lang = "en", voice = "ryan", speed = 1.0 },
  { lang = "zh", voice = "serena", speed = 0.8 },
  { lang = "en", voice = "ryan", speed = 1.0 },
  { lang = "zh", voice = "serena", speed = 1.0 },
  { lang = "en", voice = "ryan", speed = 1.0 },
]

[profiles.voice-clone]
use_instruct = false
pause_ms = 300
sequence = [
  { lang = "zh", voice = "ann", speed = 0.6 },
  { lang = "en", voice = "scott", speed = 1.0 },
  { lang = "zh", voice = "ann", speed = 0.8 },
  { lang = "en", voice = "scott", speed = 1.0 },
  { lang = "zh", voice = "ann", speed = 1.0 },
  { lang = "en", voice = "scott", speed = 1.0 },
]
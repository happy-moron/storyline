# Provider mode: "local" manages the llamacpp systemd service;
# "remote" uses a cloud API and skips local service management.
# Model switching for local is handled by restarting the llamacpp service
# with the desired profile — the llm library always talks to the same
# host:port, so model_name / model_id are fixed.
[llm]
provider = "local"
model_name = "local-llamacpp"
model_id = "local-llamacpp"

# Default llamacpp profile for tasks
[default]
profile = "gemma4-26b-a4b-nothink"

# profile = "gemma4-26b-a4b"
# Optional: thinking_budget_tokens controls llama.cpp reasoning budget per request.
# Omit or set to null to disable.
thinking_budget_tokens = 4096

[translate]
profile = "gemma4-26b-a4b"

# profile = "qwen38-27b"
# thinking_budget_tokens = 4096

[tokenize]
# profile = "qwen38-27b"
# profile = "qwen36-35b-a3b-lowthink"

profile = "gemma4-26b-a4b-nothink"
# thinking_budget_tokens = 2048

[dictionary]
# profile = "qwen36-35b-a3b-lowthink"

profile = "gemma4-26b-a4b-nothink"
# profile = "qwen38-27b"
# profile = "qwen36-35b-a3b-lowthink"
# No thinking_budget_tokens = no reasoning budget sent


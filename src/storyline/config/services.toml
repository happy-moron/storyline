# =============================================================================
# Service definitions — extracted from ServiceManager hardcoded values
# =============================================================================

[services.llm]
systemd_name = "llamacpp"
port = 11432
health_endpoint = "http://127.0.0.1:11432/v1/models"
start_timeout = 120
stop_timeout = 60
profile_dir = "~/llamacpp"

[services.tts]
systemd_name = "qwentts"
port = 11433
health_endpoint = "http://127.0.0.1:11433/health"
start_timeout = 120
stop_timeout = 30
base_url = "http://127.0.0.1:11433"
request_timeout = 300

[services.image_gen]
systemd_name = "qwen-image-gen"
port = 11434
health_endpoint = "http://127.0.0.1:11434/health"
start_timeout = 60
stop_timeout = 15

[gpu]
free_memory_threshold_mb = 4000